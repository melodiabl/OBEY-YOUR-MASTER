services:
  images:
    build: ./image-service
    image: localhost/obey-images:release
    container_name: obey_images
    restart: unless-stopped
    network_mode: "host"
    mem_limit: 600m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3203/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  lavalink:
    profiles: ["managed-lavalink"]
    build: ./lavalink
    image: localhost/obey-lavalink-warp:4.2.2
    container_name: obey_lavalink
    restart: unless-stopped
    network_mode: "host"
    env_file: .env
    environment:
      - _JAVA_OPTIONS=-Xms256M -Xmx768M -Djava.net.preferIPv4Stack=true
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./lavalink/plugins:/opt/Lavalink/plugins:ro
    mem_limit: 900m
    memswap_limit: 1100m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header=\"Authorization: $${LAVALINK_PASSWORD}\" -O /dev/null http://127.0.0.1:2333/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  bot:
    build: .
    image: localhost/obey-your-master_bot:latest
    container_name: obey_bot
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      - images
    env_file: .env
    network_mode: "host"
    mem_limit: 1200m
    memswap_limit: 1400m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
