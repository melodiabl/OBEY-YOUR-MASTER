name: Platform checks

on:
  pull_request:
    branches: [feat/motor-soundy]
  push:
    branches: [feature/obey-main-implementation]

permissions:
  contents: read

concurrency:
  group: obey-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install native Canvas build requirements
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev python3
      - run: npm ci
      - run: npm test
      - run: node scripts/obey-assets.js
      - run: node scripts/validate-commands.js
      - name: Build runtime image without starting services
        run: docker build -t obey-platform-check .
      - name: Verify Architect storage and jobs in isolated services
        run: |
          trap 'docker rm -f obey-jobs-test-redis obey-architect-test-mongo >/dev/null 2>&1 || true' EXIT
          docker run -d --name obey-architect-test-mongo --network none mongo:7 --bind_ip 127.0.0.1 --port 27017
          for architect_attempt in $(seq 1 20); do
            if docker exec obey-architect-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker run --rm --network container:obey-architect-test-mongo -e OBEY_ARCHITECT_TEST_MONGO_URL=mongodb://127.0.0.1:27017/obey_architect_test --entrypoint node obey-platform-check scripts/verify-architect-storage.js
          docker run -d --name obey-jobs-test-redis --network container:obey-architect-test-mongo redis:7-alpine redis-server --bind 127.0.0.1 --appendonly yes --appendfsync always --save ''
          for jobs_attempt in $(seq 1 20); do
            if docker exec obey-jobs-test-redis redis-cli ping >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker run --rm --network container:obey-architect-test-mongo -e OBEY_JOBS_TEST_MONGO_URL=mongodb://127.0.0.1:27017/obey_jobs_test -e OBEY_JOBS_TEST_REDIS_URL=redis://127.0.0.1:6379/15 --entrypoint node obey-platform-check scripts/verify-jobs-runtime.js
