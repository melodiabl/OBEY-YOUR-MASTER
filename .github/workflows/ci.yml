name: Platform checks

on:
  pull_request:
    branches: [master, feature/obey-main-implementation, feat/motor-soundy]
  push:
    branches: [master, feature/obey-main-implementation]

permissions:
  contents: read

concurrency:
  group: obey-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/frontend/package-lock.json
      - name: Install native Canvas build requirements
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev python3
      - run: npm ci
      - run: npm ci --prefix dashboard/frontend --ignore-scripts
      - run: npm run typecheck:welcome
      - run: npm run dependencies:welcome
      - run: npm run web:typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm audit --prefix dashboard/frontend --audit-level=high
      - name: Verify capability classification without promoting functional acceptance
        run: node scripts/verify-p0-classification.js
      - run: node scripts/obey-assets.js
      - name: Build Next.js panel and runtime image without starting services
        run: docker build -t obey-platform-check .
      - name: Validate effective inventory, owners and alias policy in the image
        run: |
          docker run --rm --network none -i --entrypoint node obey-platform-check <<'NODE'
          const fs = require('node:fs'), crypto = require('node:crypto'), assert = require('node:assert/strict')
          assert.equal(process.version, 'v22.23.4')
          assert.equal(process.versions.undici, '6.29.1')
          const inventory = require('./docs/platform/operation-ownership.json')
          for (const [file, expected] of Object.entries(inventory.sourceHashes)) {
            assert(!file.includes('..') && !file.startsWith('/'))
            assert.equal(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'), expected, `Refresh inventory for ${file}`)
          }
          const commands = new Map(), ids = new Set(), entryFiles = new Set()
          for (const entry of inventory.commands) {
            assert(!ids.has(entry.id)); ids.add(entry.id); entryFiles.add(entry.owner)
            assert.equal(inventory.owners[entry.owner].kind, 'current-command-adapter')
            const command = require('./' + entry.owner)
            assert.equal(typeof command.run, 'function'); assert.equal(command.name, entry.name)
            if (entry.transport === 'prefix') commands.set(command.name, command)
          }
          const walk = directory => fs.readdirSync(directory, { withFileTypes: true }).flatMap(item => item.isDirectory() ? walk(`${directory}/${item.name}`) : item.name.endsWith('.js') ? [`${directory}/${item.name}`] : [])
          assert.deepEqual([...entryFiles].sort(), [...walk('commands'), ...walk('slashCommands')].sort())
          const { buildAliases, PREFERRED_ALIASES } = require('./handlers/command-registry')
          const aliases = buildAliases(commands)
          assert.deepEqual([...aliases.aliases].sort(([a], [b]) => a.localeCompare(b)), inventory.aliases.map(entry => [entry.alias, entry.target]))
          for (const { alias } of aliases.conflicts) assert.equal(PREFERRED_ALIASES[alias], aliases.aliases.get(alias), `Explicit policy required for ${alias}`)
          const routes = new Set(inventory.routes.map(route => route.id))
          assert.equal(routes.size, inventory.routes.length)
          for (const route of inventory.routes) assert.equal(inventory.owners[route.owner].kind, 'current-http-adapter')
          const review = require('./docs/platform/shared-intents.json'), intents = new Set()
          for (const intent of review.reviewedIntents) {
            assert(!intents.has(intent.id)); intents.add(intent.id)
            for (const id of intent.commands) assert(ids.has(id), `Unknown reviewed command: ${id}`)
            for (const id of intent.routes) assert(routes.has(id), `Unknown reviewed route: ${id}`)
          }
          assert.equal(review.coverage.reviewedGroups, intents.size)
          const client = { commands, aliases: aliases.aliases, slashCommands: new Map(), allCommands: [], settings: {}, guilds: { cache: new Map() } }
          const music = require('./handlers/music/manifest')(client)
          require('./handlers/configuration')(client)
          require('./handlers/utilities')(client)
          require('./handlers/architect')(client)
          for (const manifest of [music, ...client.modules.list()]) for (const route of manifest.api) {
            const registered = route.replace('/modules/welcome/', '/modules/:moduleId/').replace('/configuration/:guildId/welcome', '/configuration/:guildId/:moduleId')
            assert(routes.has(registered), `Manifest route is not registered: ${route}`)
          }
          const dependencies = require('./package.json').dependencies
          for (const dependency of inventory.externalImports) if (!dependencies[dependency.name]) {
            const exception = inventory.dependencyExceptions.find(item => item.name === dependency.name && item.activated === false)
            assert(exception && dependency.sites.every(site => site.file === exception.file), `Undeclared runtime dependency: ${dependency.name}`)
          }
          console.log(JSON.stringify({ commands: ids.size, aliases: aliases.aliases.size, routes: routes.size, node: process.version }))
          NODE
      - name: Compare actual command loaders with the inventory without login
        run: |
          docker run --rm --network none -i --entrypoint node obey-platform-check <<'NODE'
          const assert = require('node:assert/strict'), { EventEmitter } = require('node:events')
          require('colors')
          const { Client, Collection } = require('discord.js')
          const scheduler = require.resolve('discord-giveaways'), original = require(scheduler)
          // Only the giveaway scheduler is replaced; command loaders and exports are real.
          require.cache[scheduler].exports = { ...original, GiveawaysManager: class extends EventEmitter {} }
          const client = new Client({ intents: [] })
          Object.assign(client, { commands: new Collection(), aliases: new Map(), slashCommands: new Collection(), allCommands: [], backupDB: new Map() })
          for (const method of ['get', 'post', 'put', 'patch', 'delete']) client.rest[method] = () => { throw Error('Network access is forbidden in the registry check') }
          async function verify() {
            try {
              await require('./handlers/command')(client)
              await require('./handlers/slashCommands')(client)
              const { buildCommandCatalog } = require('./handlers/command-registry')
              const inventory = require('./docs/platform/operation-ownership.json')
              const catalog = buildCommandCatalog(client)
              assert.deepEqual(catalog.map(entry => entry.id).sort(), inventory.commands.map(entry => entry.id).sort())
              for (const entry of inventory.commands) {
                const parts = entry.id.replace(/^slash:/, '').split('.')
                const loaded = entry.transport === 'prefix' ? client.commands.get(entry.name) : client.slashCommands.get(parts.length === 1 ? 'normal' + parts[0] : parts[0] + parts.at(-1))
                assert.equal(loaded, require('./' + entry.owner), `Loader owner differs for ${entry.id}`)
              }
              assert.deepEqual([...client.aliases].sort(([a], [b]) => a.localeCompare(b)), inventory.aliases.map(entry => [entry.alias, entry.target]))
              const snapshot = require('./handlers/slash-publication-catalog').snapshotCatalog(client)
              assert.equal(snapshot.invocations, inventory.commands.filter(entry => entry.transport === 'slash').length)
              console.log(JSON.stringify({ prefix: client.commands.size, slash: client.slashCommands.size, roots: snapshot.roots, aliases: client.aliases.size, network: false, login: false }))
            } finally {
              require.cache[scheduler].exports = original
              await client.destroy()
            }
          }
          verify().catch(error => { console.error(error); process.exitCode = 1 })
          NODE
      - name: Verify the frozen NyxLink production client in isolation
        run: |
          task_dir="$RUNNER_TEMP/obey-music-client-compatibility"
          node - "$task_dir" <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), contract = require('./docs/platform/music-client-installation.json')
          const directory = process.argv[2]
          fs.mkdirSync(directory, { recursive: true })
          fs.writeFileSync(path.join(directory, 'package.json'), JSON.stringify(contract.package))
          fs.writeFileSync(path.join(directory, 'package-lock.json'), JSON.stringify(contract.lockfile))
          NODE
          npm ci --prefix "$task_dir" --ignore-scripts --no-fund --no-audit
          node - "$task_dir" <<'NODE'
          const path = require('node:path'), assert = require('node:assert/strict'), contract = require('./docs/platform/music-client-installation.json')
          const directory = process.argv[2], installed = path.join(directory, 'node_modules/nyxlink')
          assert.equal(require(installed + '/package.json').version, contract.package.dependencies.nyxlink)
          assert.equal(typeof require(installed).Manager, 'function')
          const consola = path.join(directory, 'node_modules/consola/package.json')
          assert.equal(require(consola).version, contract.lockfile.packages['node_modules/consola'].version)
          assert.equal(contract.lockfile.packages['node_modules/nyxlink'].integrity, require('./package-lock.json').packages['node_modules/nyxlink'].integrity)
          assert.equal(contract.productionDependencyInstalled, true)
          console.log(JSON.stringify({ client: require(installed + '/package.json').version, consola: require(consola).version, node: process.version, productionInstalled: true }))
          NODE
